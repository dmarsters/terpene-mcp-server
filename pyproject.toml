[project]
name = "terpene-vocabulary-mcp"
version = "2.7.0"
description = "Terpene Visual Vocabulary MCP Server — deterministic mapping of terpene compounds to visual parameters for image generation, with Phase 2.6 rhythmic presets and Phase 2.7 attractor visualization prompt generation."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Dal Marsters" }
]
keywords = [
    "mcp",
    "terpene",
    "aesthetic-dynamics",
    "image-generation",
    "visual-vocabulary",
    "computational-aesthetics"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Artistic Software",
    "Topic :: Scientific/Engineering :: Visualization",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastmcp>=2.0.0",
]

[project.scripts]
terpene-vocabulary-mcp = "terpene_vocabulary_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["terpene_vocabulary_mcp"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
]
